# Таблицы Delta в S3 (SeaweedFS). Hive Metastore ради одного стенда не поднимаем:
# схемы и регистрации таблиц хранятся файлами в том же бакете.
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://lake/_trino_metastore
delta.register-table-procedure.enabled=true
fs.s3.enabled=true
s3.endpoint=http://s3:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=retail
s3.aws-secret-key=retail12345
