[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-dwh"
version = "0.1.0"
description = "DWH сети магазинов: Oracle, PostgreSQL, файлы и Kafka -> Data Vault -> звезда -> ClickHouse"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "oracledb>=2.4",
    "clickhouse-connect>=0.8",
    "boto3>=1.34",
    "httpx>=0.27",
    "defusedxml>=0.7",
    "prometheus-client>=0.20",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5"]
lake = ["pyspark[connect]==3.5.6", "setuptools", "trino>=0.330"]
mcp = ["mcp>=1.2", "trino>=0.330"]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "respx>=0.21",
]

[project.scripts]
retail-dwh = "retail_dwh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_dwh = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "dags", "spark/jobs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: нужны живые базы из docker compose",
]
