name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests dags spark
          ruff format --check src tests dags spark
      - name: Unit tests
        run: pytest -m "not integration" -q
      - name: Compose file is valid
        run: docker compose --profile airflow --profile lake --profile monitoring config -q

  dags:
    # DAG-и проверяем в том же образе, в котором они работают в docker compose,
    # а не в отдельно поставленном Airflow — чтобы не ловить разницу версий
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image
        run: docker build -f docker/airflow/Dockerfile -t retail-dwh/airflow:ci .
      - name: DAG tests
        run: >
          docker run --rm --entrypoint bash -v "$PWD":/opt/retail -w /opt/retail
          -e PYTHONPATH=/opt/retail/src -e RETAIL_PROJECT_DIR=/opt/retail
          retail-dwh/airflow:ci -c "pip install -q pytest && python -m pytest -q tests/test_dags.py"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IT_SKIP_PIPELINES: fx_rates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start sources and DWH
        run: docker compose up -d --wait oracle crm-db dwh-db s3
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate and generate sources
        run: |
          cp .env.example .env
          sed -i 's/^RETAIL_PUSHGATEWAY=.*//' .env
          retail-dwh migrate
          retail-dwh simulate --orders-per-day 60 --stock-days 3
      - name: Integration tests
        run: pytest -m integration -v

  k8s:
    # Тот же скрипт, которым стенд поднимается локально: kind, образ,
    # манифесты, миграции и Airflow через Helm. Потом проверяем, что
    # все поды готовы и DAG-и разобрались без ошибок.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Manifests render
        run: kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/base > /dev/null
      - name: Up
        run: k8s/scripts/up.sh
      - name: Everything is ready
        run: |
          kubectl -n retail-dwh rollout status deploy/spark-connect --timeout=600s
          kubectl -n retail-dwh rollout status deploy/trino --timeout=300s
          kubectl -n retail-dwh get pods
      - name: DAGs parse in the cluster
        run: |
          kubectl -n retail-dwh exec deploy/airflow-scheduler -c scheduler -- \
            bash -c 'airflow dags list-import-errors -o plain | tee /tmp/err; ! grep -q "\.py" /tmp/err'
      - name: Spark executors start on demand
        run: |
          kubectl -n retail-dwh exec deploy/airflow-scheduler -c scheduler -- python -c "
          from retail_dwh.lake import spark_session
          print(spark_session().range(0, 1_000_000, numPartitions=4).selectExpr('sum(id)').collect())"
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n retail-dwh get pods -o wide
          kubectl -n retail-dwh get events --sort-by=.lastTimestamp | tail -40
          kubectl -n retail-dwh logs deploy/spark-connect --tail=80 || true
