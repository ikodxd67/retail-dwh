# Весь стенд. Сервисы разбиты на профили, потому что целиком стек не влезает
# в 8 ГБ, которые обычно выделены Docker Desktop:
#
#   docker compose up -d                          источники + DWH + MinIO
#   docker compose --profile airflow up -d        + оркестрация
#   docker compose --profile lake up -d           + Kafka, Spark, Trino, ClickHouse
#   docker compose --profile monitoring up -d     + Prometheus, Grafana
#
# Профили можно складывать: --profile airflow --profile lake.

x-airflow: &airflow
  image: retail-dwh/airflow:local
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: [airflow]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@dwh-db:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: local-only-not-a-secret
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    PYTHONPATH: /opt/retail/src
    RETAIL_PROJECT_DIR: /opt/retail
    # внутри сети compose сервисы видны по именам, а не через localhost
    RETAIL_ORACLE_DSN: oracle:1521/FREEPDB1
    RETAIL_CRM_DSN: postgresql://crm:crm@crm-db:5432/crm
    RETAIL_DWH_DSN: postgresql://dwh:dwh@dwh-db:5432/dwh
    RETAIL_S3_ENDPOINT: http://minio:9000
    RETAIL_CLICKHOUSE_HOST: clickhouse
    RETAIL_KAFKA_BOOTSTRAP: kafka:19092
    RETAIL_PUSHGATEWAY: pushgateway:9091
    RETAIL_TRINO_HOST: trino
    RETAIL_TRINO_PORT: "8080"
    RETAIL_SPARK_CONNECT: sc://spark:15002
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/retail/src:ro
    - ./pipelines:/opt/retail/pipelines:ro
    - ./models:/opt/retail/models:ro
    - ./sql:/opt/retail/sql:ro
    - ./catalog:/opt/retail/catalog:ro
    - ./spark:/opt/retail/spark:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    dwh-db:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- источники
  # ERP сети. Oracle Free — бесплатная редакция 23ai, по SQL та же база, что в
  # проде, только с лимитами на память и размер данных.
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: erp
      APP_USER_PASSWORD: erp
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # CRM: клиенты и программа лояльности.
  crm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5433:5432"
    volumes:
      - crm-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- хранилище
  # Сам DWH. В этой же инстанции лежит база метаданных Airflow — отдельный
  # сервер ради неё съел бы ещё сотни мегабайт, а на стенде память в дефиците.
  dwh-db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_wal_size=2GB
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh
      POSTGRES_DB: dwh
    ports:
      - "5432:5432"
    volumes:
      - dwh-data:/var/lib/postgresql/data
      - ./docker/dwh-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh -d dwh"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище: сюда поставщики и склады кладут файлы (landing),
  # и здесь же лежит озеро с таблицами Delta (lake).
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing local/landing local/lake local/archive
      "
    restart: "no"

  # ---------------------------------------------------------------- Airflow
  airflow-init:
    <<: *airflow
    command: db migrate
    restart: "no"

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # в Airflow 3 разбор DAG-файлов — отдельный процесс
  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------- мониторинг
  # Airflow шлёт метрики по StatsD (UDP), Prometheus умеет только забирать
  # их по HTTP — statsd-exporter переводит одно в другое.
  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    profiles: [monitoring, airflow]
    command: --statsd.mapping-config=/etc/statsd/mapping.yml
    volumes:
      - ./docker/monitoring/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    ports:
      - "9102:9102"

  # сюда задачи загрузки отправляют свои метрики в конце работы
  pushgateway:
    image: prom/pushgateway:v1.11.3
    profiles: [monitoring, airflow]
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v3.13.4
    profiles: [monitoring]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.0-slim
    profiles: [monitoring]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  # --------------------------------------------------------------- озеро
  kafka:
    image: apache/kafka:4.2.2
    profiles: [lake]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # два адреса: kafka:19092 для контейнеров, localhost:9092 для хоста
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Генератор кликстрима сайта: пишет события в топик web.events
  event-producer:
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    profiles: [lake]
    environment:
      PYTHONPATH: /opt/retail/src
      RETAIL_KAFKA_BOOTSTRAP: kafka:19092
      EVENTS_PER_SECOND: "15"
    volumes:
      - ./src:/opt/retail/src:ro
    depends_on:
      kafka:
        condition: service_healthy

  # Spark Connect: Airflow отправляет планы запросов по gRPC и не держит у
  # себя ни JVM, ни Spark. Сервер работает в local-режиме — для стенда хватает.
  spark:
    image: bitnamilegacy/spark:3.5.6
    profiles: [lake]
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
      HADOOP_USER_NAME: spark
    command:
      - /opt/bitnami/spark/sbin/start-connect-server.sh
      - --master
      - local[4]
      - --driver-memory
      - 1200m
      - --packages
      - org.apache.spark:spark-connect_2.12:3.5.6,io.delta:delta-spark_2.12:3.3.2,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,org.apache.hadoop:hadoop-aws:3.3.4
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://minio:9000
      - --conf
      - spark.hadoop.fs.s3a.access.key=minio
      - --conf
      - spark.hadoop.fs.s3a.secret.key=minio12345
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.jars.ivy=/opt/ivy
    ports:
      - "15002:15002"   # Spark Connect
      - "4040:4040"     # Spark UI
    volumes:
      - ivy-cache:/opt/ivy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/15002'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    profiles: [lake]
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9009:9000"   # 9000 уже занят MinIO
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1, а не localhost: ClickHouse в этом образе не слушает IPv6
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Trino: один SQL поверх Oracle, PostgreSQL, ClickHouse и Delta в MinIO
  trino:
    image: trinodb/trino:483
    profiles: [lake]
    ports:
      - "8085:8080"
    volumes:
      - ./docker/trino/catalog:/etc/trino/catalog:ro
    environment:
      JAVA_TOOL_OPTIONS: -Xmx1g

volumes:
  kafka-data:
  ivy-cache:
  clickhouse-data:
  prometheus-data:
  oracle-data:
  crm-data:
  dwh-data:
  minio-data:
  airflow-logs:
