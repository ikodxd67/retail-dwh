# Локальный кластер для отработки: один узел, он же control plane.
# Несколько узлов в kind — это несколько контейнеров на той же машине:
# памяти уходит больше, а отказоустойчивости не прибавляется.
#
# Порты наружу не пробрасываются: с хоста к сервисам ходим через
# kubectl port-forward (см. docs/kubernetes.md), чтобы кластер не занимал
# 5432 и 9000, нужные стенду в docker compose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: retail-dwh
nodes:
  - role: control-plane
